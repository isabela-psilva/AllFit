<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>AllFit - Login</title>
    <script src="script.js"></script>
    <link rel="stylesheet" href="baseStyle.css">
</head>
<body>

    <header>
        <div class="logo"><img width="100px" src="logo 3.png" alt="AllFit"></div>
        <nav>
            <a href="index.html">Início</a>
            <a href="cadastro.html">Cadastro</a>
            
        </nav>
    </header>

    <div class="espaco-header"></div>

<section class="fundo-imagem">

    <div class="card-form">

        <h1>Entrar</h1>

        <input class="form-item" type="email" id="email" placeholder="E-mail" />
        <input class="form-item" type="password" id="senha" placeholder="Senha" />

        <div class="botoes">
            <button class="primary-button" onclick="login()">Entrar</button>
        </div>
        <div id="meuModal" class="modal-container" style="display: none;">
            <div class="modal-box">
                <h2 id="modalTitulo" style="margin-top: 0;">Título</h2>
                <br>
                <p id="modalTexto">Mensagem da operação.</p>
                <input type="button" id="btnModalOk" class="primary-button" value="Ok">
            </div>
        </div>

        <p>Não tem conta? <a href="cadastro.html">Cadastre-se</a></p>

    </div>

</section>

    <footer>
        <p>AllFit © 2026</p>
    </footer>

    <script>
        function login() {
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            if (!email || !senha) {
                exibirModal("Atenção!", "Preencha todos os campos!");
                return;
            }

            const usuario = JSON.parse(localStorage.getItem(email));

            if (!usuario) {
                exibirModal("Ops...", "E-mail não cadastrado. Redirecionando para o cadastro...", "cadastro.html");
            } else if (usuario.senha !== senha) {
                exibirModal("Erro!", "Senha incorreta!");
            } else {
                localStorage.setItem('usuarioLogado', email);
                exibirModal("Olá!", "Bem-vindo(a), " + usuario.nome + "!", "dashboard.html");
            }
        }
    </script>

</body>
</html>
