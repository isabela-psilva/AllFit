<html lang="PT-BR">
    <head>
        <meta charset="UTF-8">
        <title>Mudar Nome de Usuário</title>
        <link rel="stylesheet" href="Base_Style.css">
        <script src="script.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>
    <body>
        <header>
        <div class="logo"><img width="100px" src="logo 1.png" alt="AllFit"></div>
        <nav>
            <a href="dashboard.html">Início</a>
            <a href="index.html">Sair</a>
        </nav>
    </header>
    <div class="espaco-header"></div>
    <section class="fundo-imagem fundo-config">

     <div class="card-form card-config-form">

        <h1>Mudar Nome de Usuário</h1>

        <h3>Insira Seu Novo Nome de Usuário</h3>
        <input id="novoNome" class="form-item" type="text" placeholder="Nome de Usuário" required>

        <h3>Digite sua Senha</h3>
        <input id="senha" class="form-item" type="password" placeholder="Senha" required>

        <div class="botoes">
            <button class="primary-button" onclick="alterarNome()">Confirmar</button>
            <button class="primary-button" onclick="cancelar()">Cancelar</button>
        </div>
        <div id="meuModal" class="modal-container" style="display: none;">
            <div class="modal-box">
                <h2 id="modalTitulo" style="margin-top: 0;">Título</h2>
                <br><p></p>
                <p id="modalTexto">Mensagem da operação.</p>
                <input type="button" id="btnModalOk" class="primary-button" value="Ok">
            </div>
        </div>

     </div>

    </section>
    <footer>
        <p>AllFit © 2026</p>
    </footer>
    <script>
     function alterarNome() {

     let novoNome = document.getElementById("novoNome");
     let senha = document.getElementById("senha");

     let nomeValor = novoNome.value.trim();
     let senhaValor = senha.value;

    
     if (nomeValor.length < 3) {
        exibirModal("Atenção!", "O nome deve ter pelo menos 3 caracteres!", null, novoNome);
        return;
     }

     if (nomeValor.length > 20) {
        exibirModal("Atenção!", "O nome deve ter no máximo 20 caracteres!", null, novoNome);
        return;
     }

    
     if (localStorage.getItem(nomeValor)) {
        exibirModal("Erro!", "Esse nome de usuário já existe!", null, novoNome);
        return;
     }

    
     let usuarioAtualEmail = localStorage.key(0);
     let usuarioAtual = JSON.parse(localStorage.getItem(usuarioAtualEmail));

     if (!usuarioAtual || usuarioAtual.senha !== senhaValor) {
        exibirModal("Erro!", "Senha incorreta!", null, senha);
        return;
     }

     
     usuarioAtual.nome = nomeValor;

     localStorage.setItem(usuarioAtualEmail, JSON.stringify(usuarioAtual));

     exibirModal("Sucesso!", "Nome alterado com sucesso!", "configuracao.html");
     }

     
     function cancelar() {
     let confirmar = confirm("Deseja cancelar a operação?");

     if (confirmar) {
        window.location.href = "configuracao.html";
     }
     }
    </script>
    </body>
    

</html>
