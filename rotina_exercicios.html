<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Plano de Exercícios</title>
    <link rel="stylesheet" href="Base_Style.css">
    <link rel="stylesheet" href="dashboardStyle.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>

<section class="dashboard">

    <aside class="sidebar">
        <img class="logo-dash" src="logo 1.png" alt="AllFit">

        <nav class="menu-dash">
            <a href="dashboard.html">
                <img src="home.png" alt="">
                Início
            </a>

            <a href="perfil.html">
                <img src="profile.png" alt="">
                Meu Perfil
            </a>

            <a href="#" onclick="abrirDieta()">
                    <img src="diet.png" alt="">
                    Alimentação
                </a>
            <a href="#" onclick="abrirExercicios()">
                <img src="dumbbell.png" alt="">
                Exercícios
            </a>

            <a href="configuracao.html">
                <img src="settings.png" alt="">
                Configurações
            </a>
        </nav>

        <a class="sair-dash" href="index.html">
            <img src="logout.png" alt="">
            Sair
        </a>
    </aside>
    <div class="page-container">
        <main class="conteudo-dash">

            <div class="topo-dash">
                <div>
                    <div class="texto-topo">
                        <h1>Seu Plano de Exercícios</h1>
                        <p>Treinos organizados conforme seus dados, dias disponíveis e objetivo.</p>
                        <button class="secondary-button" style="width: 150px; margin-top: 10px;" onclick="window.location.href='rotinaExercicio.html?editar=true'">Editar meu plano</button>
                    </div>
                </div>
                <div class="imagem-topo">
                    <img src="dumbbell.png" alt="">
                </div>
            </div>

            <section class="resumo-exercicio" id="resumoExercicio"></section>

            <section class="area-treino" id="areaTreino"></section>

            <section class="orientacoes-treino">
                <h2>Orientações do plano</h2>

                <div class="orientacoes-grid" id="orientacoesGrid"></div>
            </section>

        </main>
    </div>
</section>
    <footer class="footer-dash">
        <p>AllFit © 2026</p>
    </footer>
    <script>

        const emailLogado = localStorage.getItem("usuarioLogado");

        const treino = JSON.parse(
            localStorage.getItem(`treino_${emailLogado}`)
        );

        window.onload = function () {

            if (!treino) {
                exibirTreinoVazio();
            } else {
                preencherTreino();
            }

        };

        function exibirTreinoVazio() {

            document.getElementById("resumoExercicio").innerHTML = `
            <div class="dash-card">
                <p>Tipo</p>
                <h2>Não definido</h2>
                <span>Sem rotina</span>
            </div>

            <div class="dash-card">
                <p>Frequência</p>
                <h2>--</h2>
                <span>Sem rotina</span>
            </div>

            <div class="dash-card">
                <p>Horário</p>
                <h2>--</h2>
                <span>Sem rotina</span>
            </div>

            <div class="dash-card">
                <p>Local</p>
                <h2>--</h2>
                <span>Sem rotina</span>
            </div>
            `;

            document.getElementById("areaTreino").innerHTML = `
            <div class="treino-card" style="grid-column:1/-1;text-align:center;">
                <h2>Nenhum plano de exercícios cadastrado</h2>

                <p>
                    Crie sua rotina para receber exercícios personalizados.
                </p>

                <br>

                <a href="rotinaExercicio.html"
                    class="primary-button">
                    Criar plano
                </a>
            </div>
            `;

            document.getElementById("orientacoesGrid").innerHTML = `
            <span>Nenhuma orientação disponível.</span>
            `;
        }

        function preencherTreino() {

            document.getElementById("resumoExercicio").innerHTML = `
            <div class="dash-card">
                <p>Tipo</p>
                <h2>${treino.tipoExercicio}</h2>
                <span>Treino principal</span>
            </div>

            <div class="dash-card">
                <p>Frequência</p>
                <h2>${treino.diasTreino}x</h2>
                <span>${treino.dias.join(", ")}</span>
            </div>

            <div class="dash-card">
                <p>Horário</p>
                <h2>${treino.horarioInicio}</h2>
                <span>${treino.duracao} min</span>
            </div>

            <div class="dash-card">
                <p>Local</p>
                <h2>${treino.local}</h2>
                <span>Local escolhido</span>
            </div>
            `;

            gerarTreinosAutomaticos();
        }

        function gerarTreinosAutomaticos() {

            let html = "";

            treino.dias.forEach(dia => {

                html += `
                <div class="treino-card">

                    <h2>${formatarDia(dia)}</h2>

                    <h3>${tituloTreino()}</h3>

                    ${listaExercicios()}

                </div>
                `;

            });

            document.getElementById("areaTreino").innerHTML = html;

            gerarOrientacoes();
        }

        function formatarDia(dia){

            const nomes = {
            segunda: "Segunda-feira",
            terca: "Terça-feira",
            quarta: "Quarta-feira",
            quinta: "Quinta-feira",
            sexta: "Sexta-feira"
        };

        return nomes[dia] || dia;
    }

    function tituloTreino() {

        const usuario = JSON.parse(
            localStorage.getItem(emailLogado)
        );

        if (!usuario) return "Treino Geral";

        let imc =
        usuario.peso /
        (usuario.altura * usuario.altura);

        if (imc < 18.5)
        return "Hipertrofia";

        if (imc > 25)
        return "Emagrecimento";

        return "Condicionamento";
    }

    function listaExercicios() {

        const usuario = JSON.parse(
            localStorage.getItem(emailLogado)
        );

        if (!usuario) {
            return `
            <div class="exercicio-item">
                <b>Defina seu perfil primeiro</b>
                <span>Sem exercícios disponíveis</span>
            </div>
            `;
        }

        let imc =
        usuario.peso /
        (usuario.altura * usuario.altura);

        if (imc < 18.5) {

            return `
            <div class="exercicio-item">
                <b>Supino reto</b>
                <span>4 séries • 10 repetições</span>
            </div>

            <div class="exercicio-item">
                <b>Agachamento livre</b>
                <span>4 séries • 10 repetições</span>
            </div>

            <div class="exercicio-item">
                <b>Remada baixa</b>
                <span>4 séries • 10 repetições</span>
            </div>

            <div class="exercicio-item">
                <b>Desenvolvimento</b>
                <span>3 séries • 12 repetições</span>
            </div>
            `;
        }

        if (imc > 25) {

            return `
            <div class="exercicio-item">
                <b>Caminhada</b>
                <span>30 minutos</span>
            </div>

            <div class="exercicio-item">
                <b>Bicicleta</b>
                <span>20 minutos</span>
            </div>

            <div class="exercicio-item">
                <b>Prancha</b>
                <span>3 séries • 30 segundos</span>
            </div>

            <div class="exercicio-item">
                <b>Abdominal</b>
                <span>3 séries • 15 repetições</span>
            </div>
            `;
        }

        return `
        <div class="exercicio-item">
            <b>Alongamento</b>
            <span>10 minutos</span>
        </div>

        <div class="exercicio-item">
            <b>Corrida leve</b>
            <span>20 minutos</span>
        </div>

        <div class="exercicio-item">
            <b>Abdominal</b>
            <span>3 séries • 15 repetições</span>
        </div>

        <div class="exercicio-item">
            <b>Polichinelo</b>
            <span>3 séries • 30 segundos</span>
        </div>
        `;
    }

    function gerarOrientacoes() {

        document.getElementById("orientacoesGrid").innerHTML = `
        <span>Aquecimento de 10 minutos</span>
        <span>Hidratação durante o treino</span>
        <span>Alongamento após finalizar</span>
        <span>Respeitar limites físicos</span>
        <span>Manter frequência semanal</span>
        `;
    }
    function abrirDieta() {
        const emailLogado = localStorage.getItem("usuarioLogado");
        const dieta = localStorage.getItem(`dieta_${emailLogado}`);

        if (dieta) {
            window.location.href = "rotina_dieta.html";
        } else {
            window.location.href = "dieta.html";
        }
    }

    function abrirExercicios() {
        const emailLogado = localStorage.getItem("usuarioLogado");
        const treino = localStorage.getItem(`treino_${emailLogado}`);

        if (treino) {
            window.location.href = "rotina_exercicios.html";
        } else {
            window.location.href = "rotinaExercicio.html";
        }
    }
</script>
</body>
</html>
