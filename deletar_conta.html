<html lang="PT-BR">
    <head>
        <meta charset="UTF-8">
        <title>Deletar Conta</title>
        <link rel="stylesheet" href="Base_Style.css">
        <script src="script.js"></script>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">

    </head>
    <body>
        <header>
        <div class="logo"><img width="100px" src="logo 1.png" alt="AllFit"></div>
        <nav>
            <a href="dashboard.html">Início</a>
            <a href="index.html">Sair</a>
        </nav>
    </header>
    <div class="espaco-header"></div>
    <section class="fundo-imagem fundo-config">

     <div class="card-form card-config-form">

        <h1>Deletar Conta</h1>

        <h3>Você tem certeza de que quer deletar sua conta?</h3>

        <!-- <div class="checkbox-group"> -->
            <label><input id="confirmacao" type="checkbox"> Sim</label>
            <!-- <label><input type="checkbox"> Não</label> -->
        <!-- </div> -->

        <h3>Insira Sua Senha</h3>

        <input id="senha" class="form-item" type="password" placeholder="Senha">

        <div class="botoes">
            <button class="primary-button" onclick="deletarConta()">Confirmar</button>
            <button class="primary-button" onclick="cancelar()">Cancelar</button>
        </div>
        <div id="meuModal" class="modal-container" style="display: none;">
            <div class="modal-box">
                <h2 id="modalTitulo" style="margin-top: 0;">Título</h2>
                <br><p></p>
                <p id="modalTexto">Mensagem da operação.</p>
                <input type="button" id="btnModalOk" class="primary-button" value="Ok">
            </div>
        </div>

     </div>

    </section>
    <footer>
        <p>AllFit © 2026</p>
    </footer>
    <script>
        function deletarConta() {

            let confirmacao = document.getElementById("confirmacao");
            let senha = document.getElementById("senha");

            let senhaValor = senha.value.trim();

            if (!confirmacao.checked) {
                exibirModal("Atenção!", "Você precisa confirmar que deseja deletar a conta!");
                return;
            }

            let usuarioEmail = localStorage.getItem("usuarioLogado");

            if (!usuarioEmail) {
                exibirModal("Erro!", "Nenhum usuário está logado.", "login.html");
                return;
            }

            let usuario = JSON.parse(localStorage.getItem(usuarioEmail));

            if (!usuario || usuario.senha !== senhaValor) {
                exibirModal("Erro!", "Senha incorreta!", null, senha);
                return;
            }

            let certeza = confirm("Tem certeza absoluta que deseja excluir sua conta?");

            if (!certeza) {
                return;
            }

            localStorage.removeItem(usuarioEmail);
            localStorage.removeItem("usuarioLogado");
            localStorage.removeItem(`dieta_${usuarioEmail}`);
            localStorage.removeItem(`treino_${usuarioEmail}`);

            exibirModal("Sucesso!", "Conta deletada com sucesso!", "index.html");
        }

        function cancelar() {
            let confirmar = confirm("Deseja cancelar a operação?");

            if (confirmar) {
                window.location.href = "configuracao.html";
            }
        }
    </script>
</body>
    

</html>
